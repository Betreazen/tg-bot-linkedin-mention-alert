services:
  linkedin-mentions-bot:
    mem_limit: 400m
    memswap_limit: 800m
    environment:
      # glibc резервирует память про запас на каждый поток Python; 2 арены заметно снижают аппетит.
      MALLOC_ARENA_MAX: "2"
    build: .
    env_file: .env
    volumes:
      - ./data:/data          # SQLite (токены + дедуп + курсор) переживает рестарт
    restart: unless-stopped
    logging:                  # логи не должны съесть диск за месяцы работы
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
